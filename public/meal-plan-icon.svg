<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Meal Plan App Icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#241a0c"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="96" y1="96" x2="416" y2="416">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feFlood flood-color="#f59e0b" flood-opacity="0.4"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.22"/>

  <g filter="url(#g)">
    <!-- Calendar frame with rings -->
    <rect x="112" y="132" width="288" height="256" rx="36" fill="#2a1f0d" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
    <line x1="112" y1="194" x2="400" y2="194" stroke="url(#accent)" stroke-width="10" opacity="0.7"/>
    <line x1="184" y1="108" x2="184" y2="156" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <line x1="328" y1="108" x2="328" y2="156" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <!-- Plate -->
    <circle cx="256" cy="292" r="58" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <circle cx="256" cy="292" r="34" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.55"/>
    <!-- Fork + knife -->
    <line x1="166" y1="246" x2="166" y2="340" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
    <path d="M152,244 L152,272 Q166,284 180,272 L180,244" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M346,340 L346,246 Q364,262 360,300 L346,300" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
