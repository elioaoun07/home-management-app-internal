# HUB-37 — CI: typecheck, lint, tests (incl. the ERA Gym replay) and the
# PM/doc checks pre-commit already runs. The Gym replays recorded model
# responses (tests/era-gym/recordings) — CI never calls Gemini.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A1's inventory acceptance fixture reads the documented e5f537a cutoff.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Agentic OS conflicts and drift
        run: pnpm os:check

      - name: Agentic OS rule verdicts
        if: always() && github.event_name == 'pull_request'
        env:
          OS_BASE: ${{ github.event.pull_request.base.sha }}
          OS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm os:eval "$OS_BASE..$OS_HEAD"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests (includes the ERA Gym replay)
        run: pnpm test

      - name: PM lint
        run: pnpm pm:lint

      - name: Feature Index ↔ Feature Map
        run: pnpm docs:check
